name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  validate:
    name: Validate MNCS source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout mncs-tui
        uses: actions/checkout@v4
        with:
          path: mncs-tui

      - name: Checkout mncs-language
        uses: actions/checkout@v4
        with:
          repository: epi13/mncs-language
          path: mncs-language

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            mncs-language/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build mncs-cli
        working-directory: mncs-language
        run: cargo build --release -p mncs-cli

      - name: Validate source and examples
        working-directory: mncs-tui
        env:
          MNCS_CLI: ${{ github.workspace }}/mncs-language/target/release/mncs
          MNCS_LIBRARY_PATH: ${{ github.workspace }}/mncs-language/library:${{ github.workspace }}/mncs-tui/src
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            "$MNCS_CLI" validate "$source"
          done < <(find src -maxdepth 1 -type f -name '*.mncs' -print0 | sort -z)
          for source in \
            examples/first-layout.mncs \
            examples/full-demo.mncs \
            examples/focused-tests.mncs \
            examples/render-probe.mncs \
            examples/interaction-probe.mncs \
            examples/backend-repro.mncs; do
            "$MNCS_CLI" validate "$source"
          done
          if rg -n 'return true|= true;[[:space:]]*//|avoid hang|skip.*hang' examples/full-demo.mncs; then
            echo "full-demo contains an unconditional or hang-masking assertion" >&2
            exit 1
          fi

      - name: Run bounded source studies
        working-directory: mncs-tui
        env:
          MNCS_CLI: ${{ github.workspace }}/mncs-language/target/release/mncs
          MNCS_LIBRARY_PATH: ${{ github.workspace }}/mncs-language/library:${{ github.workspace }}/mncs-tui/src
        run: |
          set -euo pipefail
          "$MNCS_CLI" source-study examples/full-demo.mncs > /tmp/mncs-tui-full-demo-source-study.json
          "$MNCS_CLI" source-study examples/focused-tests.mncs > /tmp/mncs-tui-focused-source-study.json

  test_layout:
    name: Layout solver tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - name: Checkout mncs-tui
        uses: actions/checkout@v4
        with:
          path: mncs-tui

      - name: Checkout mncs-language
        uses: actions/checkout@v4
        with:
          repository: epi13/mncs-language
          path: mncs-language

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            mncs-language/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build mncs-cli
        working-directory: mncs-language
        run: cargo build --release -p mncs-cli

      - name: Check semantic layout body
        working-directory: mncs-tui
        env:
          MNCS_CLI: ${{ github.workspace }}/mncs-language/target/release/mncs
          MNCS_LIBRARY_PATH: ${{ github.workspace }}/mncs-language/library:${{ github.workspace }}/mncs-tui/src
        run: |
          set -euo pipefail
          timeout 300s "$MNCS_CLI" execute examples/backend-repro.mncs examples/execution/backend-repro-request.json > /tmp/mncs-tui-layout-body.json
          jq -e '.status == "returned" and .returned[0].integer.value == 5' /tmp/mncs-tui-layout-body.json

      - name: Record the research-backend regression with a bounded fixture
        working-directory: mncs-tui
        env:
          MNCS_CLI: ${{ github.workspace }}/mncs-language/target/release/mncs
          MNCS_LIBRARY_PATH: ${{ github.workspace }}/mncs-language/library:${{ github.workspace }}/mncs-tui/src
        run: |
          set -euo pipefail
          jq -e '.cases | length == 1 and .[0].expected_status == "budget_exhausted" and .[0].request.step_budget == 100' \
            .github/workflows/corpus/backend-repro.json
          set +e
          setsid timeout --kill-after=5s 45s "$MNCS_CLI" experiment run examples/backend-repro.mncs \
            --backend mncs-research-bytecode \
            --corpus .github/workflows/corpus/backend-repro.json \
            --output-dir /tmp/mncs-tui-backend-repro
          status=$?
          set -e
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "research backend hit the intended hard wall-clock bound (status $status)"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "research backend reproduction failed unexpectedly with status $status" >&2
            exit "$status"
          fi
          jq -e '.cases | length == 1' /tmp/mncs-tui-backend-repro/result.json
          jq -e '.cases[0].status == "budget_exhausted" and .cases[0].status_met == true' \
            /tmp/mncs-tui-backend-repro/result.json

      - name: Check the upstream weighted primitive
        working-directory: mncs-tui
        env:
          MNCS_CLI: ${{ github.workspace }}/mncs-language/target/release/mncs
          MNCS_LIBRARY_PATH: ${{ github.workspace }}/mncs-language/library:${{ github.workspace }}/mncs-tui/src
        run: |
          set -euo pipefail
          "$MNCS_CLI" experiment run "$GITHUB_WORKSPACE/mncs-language/library/core/partition.mncs" \
            --backend mncs-research-bytecode \
            --corpus "$GITHUB_WORKSPACE/mncs-language/examples/execution/partition-corpus.json" \
            --output-dir /tmp/mncs-language-partition-ci
          jq -e '.cases | length > 0 and all(.[]; .status == "returned" and .expectation_met == true)' \
            /tmp/mncs-language-partition-ci/result.json

  test_render:
    name: Render and interaction regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - name: Checkout mncs-tui
        uses: actions/checkout@v4
        with:
          path: mncs-tui

      - name: Checkout mncs-language
        uses: actions/checkout@v4
        with:
          repository: epi13/mncs-language
          path: mncs-language

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            mncs-language/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build mncs-cli
        working-directory: mncs-language
        run: cargo build --release -p mncs-cli

      - name: Run render and interaction fixtures
        working-directory: mncs-tui
        env:
          MNCS_CLI: ${{ github.workspace }}/mncs-language/target/release/mncs
          MNCS_LIBRARY_PATH: ${{ github.workspace }}/mncs-language/library:${{ github.workspace }}/mncs-tui/src
        run: |
          set -euo pipefail
          timeout 600s "$MNCS_CLI" execute examples/render-probe.mncs examples/execution/render-probe-request.json > /tmp/mncs-tui-render.json
          jq -e '.status == "returned" and .returned[0].integer.value == 1' /tmp/mncs-tui-render.json
          timeout 600s "$MNCS_CLI" execute examples/interaction-probe.mncs examples/execution/interaction-probe-request.json > /tmp/mncs-tui-interaction.json
          jq -e '.status == "returned" and .returned[0].integer.value == 1' /tmp/mncs-tui-interaction.json

  rust_checks:
    name: mncs-language Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout mncs-language
        uses: actions/checkout@v4
        with:
          repository: epi13/mncs-language
          path: mncs-language

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust fmt check
        working-directory: mncs-language
        run: cargo fmt --all -- --check

      - name: Clippy check
        working-directory: mncs-language
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        working-directory: mncs-language
        run: cargo test --workspace
