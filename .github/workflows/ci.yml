name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  validate:
    name: Validate MNCS source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout mncs-tui
        uses: actions/checkout@v4
        with:
          path: mncs-tui

      - name: Checkout mncs-language
        uses: actions/checkout@v4
        with:
          repository: epi13/mncs-language
          path: mncs-language

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            mncs-language/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build mncs-cli
        working-directory: mncs-language
        run: cargo build --release -p mncs-cli

      - name: Test reusable terminal host realization
        working-directory: mncs-tui
        run: cargo test --workspace

      - name: Validate source and examples
        working-directory: mncs-tui
        env:
          MNCS_CLI: ${{ github.workspace }}/mncs-language/target/release/mncs
          MNCS_LIBRARY_PATH: ${{ github.workspace }}/mncs-language/library:${{ github.workspace }}/mncs-tui/src
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            "$MNCS_CLI" validate "$source"
          done < <(find src -maxdepth 1 -type f -name '*.mncs' -print0 | sort -z)
          for source in \
            examples/first-layout.mncs \
            examples/full-demo.mncs \
            examples/focused_tests.mncs \
            examples/family_status.mncs \
            examples/render-probe.mncs \
            examples/interaction-probe.mncs \
            examples/backend-repro.mncs \
            examples/charts-probe.mncs; do
            "$MNCS_CLI" validate "$source"
          done
          if grep -En 'return true|= true;[[:space:]]*//|avoid hang|skip.*hang' examples/full-demo.mncs; then
            echo "full-demo contains an unconditional or hang-masking assertion" >&2
            exit 1
          fi

      - name: Run bounded source studies
        working-directory: mncs-tui
        env:
          MNCS_CLI: ${{ github.workspace }}/mncs-language/target/release/mncs
          MNCS_LIBRARY_PATH: ${{ github.workspace }}/mncs-language/library:${{ github.workspace }}/mncs-tui/src
        run: |
          set -euo pipefail
          "$MNCS_CLI" source-study examples/full-demo.mncs > /tmp/mncs-tui-full-demo-source-study.json
          "$MNCS_CLI" source-study examples/focused_tests.mncs > /tmp/mncs-tui-focused-source-study.json

  test_layout:
    name: Layout solver tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - name: Checkout mncs-tui
        uses: actions/checkout@v4
        with:
          path: mncs-tui

      - name: Checkout mncs-language
        uses: actions/checkout@v4
        with:
          repository: epi13/mncs-language
          path: mncs-language

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            mncs-language/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build mncs-cli
        working-directory: mncs-language
        run: cargo build --release -p mncs-cli

      - name: Check semantic layout body
        working-directory: mncs-tui
        env:
          MNCS_CLI: ${{ github.workspace }}/mncs-language/target/release/mncs
          MNCS_LIBRARY_PATH: ${{ github.workspace }}/mncs-language/library:${{ github.workspace }}/mncs-tui/src
        run: |
          set -euo pipefail
          timeout 300s "$MNCS_CLI" execute examples/backend-repro.mncs examples/execution/backend-repro-request.json > /tmp/mncs-tui-layout-body.json
          jq -e '.status == "returned" and .returned[0].integer.value == 5' /tmp/mncs-tui-layout-body.json

      - name: Record the research-backend regression with a bounded fixture
        working-directory: mncs-tui
        run: |
          set -euo pipefail
          jq -e '.cases | length == 1 and .[0].expected_status == "budget_exhausted" and .[0].request.step_budget == 100' \
            .github/workflows/corpus/backend-repro.json
          jq -e '.cases[0].request.target.module == "examples.backend_repro" and .cases[0].request.target.function == "probe"' \
            .github/workflows/corpus/backend-repro.json
          echo "research backend regression is recorded as a bounded, expected budget-exhaustion fixture"

      - name: Check the upstream weighted primitive
        working-directory: mncs-tui
        run: |
          set -euo pipefail
          jq -e '.cases | length == 2 and all(.[]; .expected_status == "returned" and .expected != null)' \
            "$GITHUB_WORKSPACE/mncs-language/examples/execution/partition-corpus.json"
          grep -En 'module mncs\.core\.partition\.v1|use mncs\.core\.partition\.v1' \
            "$GITHUB_WORKSPACE/mncs-language/library/core/partition.mncs" \
            src/layout.mncs

  test_render:
    name: Render and interaction regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - name: Checkout mncs-tui
        uses: actions/checkout@v4
        with:
          path: mncs-tui

      - name: Checkout mncs-language
        uses: actions/checkout@v4
        with:
          repository: epi13/mncs-language
          path: mncs-language

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            mncs-language/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build mncs-cli
        working-directory: mncs-language
        run: cargo build --release -p mncs-cli

      - name: Run render and interaction fixtures
        working-directory: mncs-tui
        env:
          MNCS_CLI: ${{ github.workspace }}/mncs-language/target/release/mncs
          MNCS_LIBRARY_PATH: ${{ github.workspace }}/mncs-language/library:${{ github.workspace }}/mncs-tui/src
        run: |
          set -euo pipefail
          timeout 600s "$MNCS_CLI" execute examples/render-probe.mncs examples/execution/render-probe-request.json > /tmp/mncs-tui-render.json
          jq -e '.status == "returned" and .returned[0].integer.value == 1' /tmp/mncs-tui-render.json
          timeout 600s "$MNCS_CLI" execute examples/interaction-probe.mncs examples/execution/interaction-probe-request.json > /tmp/mncs-tui-interaction.json
          jq -e '.status == "returned" and .returned[0].integer.value == 1' /tmp/mncs-tui-interaction.json

  test_native:
    name: Native property suites and status projection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - name: Checkout mncs-tui
        uses: actions/checkout@v4
        with:
          path: mncs-tui

      - name: Checkout mncs-language
        uses: actions/checkout@v4
        with:
          repository: epi13/mncs-language
          path: mncs-language

      - name: Checkout mncs-test
        uses: actions/checkout@v4
        with:
          repository: epi13/mncs-test
          path: mncs-test

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            mncs-language/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build mncs-cli
        working-directory: mncs-language
        run: cargo build --release -p mncs-cli

      - name: Run native property suites
        working-directory: mncs-tui
        env:
          MNCS_CLI: ${{ github.workspace }}/mncs-language/target/release/mncs
          MNCS_LIBRARY_PATH: ${{ github.workspace }}/mncs-test/native:${{ github.workspace }}/mncs-tui/src:${{ github.workspace }}/mncs-tui:${{ github.workspace }}/mncs-language/library
        run: |
          set -euo pipefail
          "$MNCS_CLI" test tests/native/framework_properties.mncs --format json > /tmp/mncs-tui-native-framework.json
          jq -e '.verdict == "PASS" and .summary.passed == 8' /tmp/mncs-tui-native-framework.json
          "$MNCS_CLI" test tests/native/status_projection.mncs --format json > /tmp/mncs-tui-native-projection.json
          jq -e '.verdict == "PASS" and .summary.passed == 9' /tmp/mncs-tui-native-projection.json

      - name: Run status projection corpus and snapshot probe
        working-directory: mncs-tui
        env:
          MNCS_CLI: ${{ github.workspace }}/mncs-language/target/release/mncs
          MNCS_LIBRARY_PATH: ${{ github.workspace }}/mncs-language/library:${{ github.workspace }}/mncs-tui/src
        run: |
          set -euo pipefail
          "$MNCS_CLI" experiment run examples/family_status.mncs --backend mncs-research-bytecode --corpus .github/workflows/corpus/family-status.json --output-dir /tmp/mncs-tui-family-status > /tmp/mncs-tui-family-status.json
          jq -e '[.cases[] | select(.expectation_met != true)] | length == 0' /tmp/mncs-tui-family-status.json
          timeout 300s "$MNCS_CLI" execute examples/family_status.mncs examples/execution/family-status-request.json > /tmp/mncs-tui-family-status-exec.json
          jq -e '.status == "returned"' /tmp/mncs-tui-family-status-exec.json

  rust_checks:
    name: mncs-language Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout mncs-language
        uses: actions/checkout@v4
        with:
          repository: epi13/mncs-language
          path: mncs-language

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust fmt check
        working-directory: mncs-language
        run: cargo fmt --all -- --check

      - name: Clippy check
        working-directory: mncs-language
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        working-directory: mncs-language
        run: cargo test --workspace
